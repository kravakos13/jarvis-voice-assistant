[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = False
warn_unused_ignores = False

# skills are looked up by name and expose skill-specific attributes (planner, memory, ...)
[mypy-jarvis.router,jarvis.assistant]
disable_error_code = attr-defined, union-attr

# Windows-only APIs (ctypes.windll, subprocess.DETACHED_PROCESS) are guarded by IS_WIN checks at runtime
[mypy-jarvis.platform_utils]
disable_error_code = attr-defined
